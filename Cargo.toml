[workspace]
resolver = "2"
members = [
    "crates/openntx-core",
    "crates/openntx-cli",
    "crates/openntx-appportal",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
authors = ["OpenNTX contributors"]
repository = "https://github.com/openntx/openntx"

[workspace.dependencies]
clap = { version = "4.5.23", features = ["derive"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
sha2 = "0.10.8"
thiserror = "2.0.9"
